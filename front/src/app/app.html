<ng-container *ngIf="authService.isLoggedIn()">
  <mat-toolbar class="rassini-toolbar">
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <img src="img/RASSINI_Logo_blanco.png" alt="Rassini Logo" class="header-logo" />
    <span class="spacer"></span>
    <span class="user-text">Área de Finanzas</span>
    <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button>
    <button mat-icon-button (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/pagos-pendientes" routerLinkActive="active-link">
          <mat-icon matListItemIcon>pending_actions</mat-icon>
          <span matListItemTitle>Pagos Pendientes de Clasificación</span>
        </a>
        <a mat-list-item routerLink="/pagos-enviados" routerLinkActive="active-link">
          <mat-icon matListItemIcon>history</mat-icon>
          <span matListItemTitle>Pagos Enviados</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="content-body">
        <div class="app-container">
          <router-outlet></router-outlet>
        </div>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<ng-container *ngIf="!authService.isLoggedIn()">
  <router-outlet></router-outlet>
</ng-container>
