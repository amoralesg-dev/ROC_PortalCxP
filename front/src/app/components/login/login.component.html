<app-app-toast>
</app-app-toast>

<div class="login-page-wrapper">

  <div class="login-header-info">

    

    <span class="environment-badge {{ environmentClass }}">
      {{ environmentName }}
    </span>

  </div>

  <rui-login
      #ruiLoginHost

      [title]="'login.title' | translate"
      [subtitle]="'login.subtitle' | translate"

      [applicationName]="'login.applicationName' | translate"

      [usernameLabel]="'login.usernameLabel' | translate"
      [usernamePlaceholder]="'login.usernamePlaceholder' | translate"

      [passwordLabel]="'login.passwordLabel' | translate"
      [passwordPlaceholder]="'login.passwordPlaceholder' | translate"

      [loginButtonText]="'login.loginButtonText' | translate"

      [loadingText]="'login.loadingText' | translate">
  </rui-login>

</div>
