<app-page-header
    [title]="'sentpage.title' | translate"
    [subtitle]="'sentpage.subtitle' | translate"
    icon="pi pi-history">
</app-page-header>

<app-page-content>

    <div class="filtros-fecha">

        <p-datepicker
            [(ngModel)]="fechaInicio"
            [placeholder]="'sentpage.startDate' | translate">
        </p-datepicker>

        <p-datepicker
            [(ngModel)]="fechaFin"
            [placeholder]="'sentpage.endDate' | translate">
        </p-datepicker>

        <p-button
            icon="pi pi-search"
            label="Buscar"
            (onClick)="onDateRangeChange()">
        </p-button>

    </div>


    <app-data-table
      [columns]="columns"
      [data]="pagos"
      [rows]="pageSize"
      [lazy]="true"
      [remoteFilter]="true"
      [totalRecords]="totalElements"
      [searchPlaceholder]="'common.search' | translate"
      [emptyTitle]="'sentpage.emptyTitle' | translate"
      [emptySubtitle]="'sentpage.emptySubtitle' | translate"
      [globalFilterFields]="[
          'codigoProveedor',
          'rfcBeneficiario',
          'nombreBeneficiario',
          'monto',
          'moneda',
          'referencia',
          'nombreArchivo',
          'nombreArchivoEnvio',
          'tipoPago',
          'estatus'
      ]"
    (globalFilterChange)="onGlobalFilter($event)"
    (lazyLoadChange)="onLazyLoad($event)">
  </app-data-table>

</app-page-content>
